# Generated by robin-review. Re-run `npx robin-review` to check for updates.
# NOTE: locally customized -- we enable review-on-synchronize so every push to a
# PR gets reviewed automatically. A plain `npx robin-review` regeneration will
# drop the `synchronize` trigger and the `with:` block below; re-apply them if
# you ever re-run it.
name: Robin

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    uses: antongulin/robin/.github/workflows/review.yml@main
    with:
      review-on-synchronize: true
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
